{% extends 'crm/index.html' %}

{% block title %}Add Contact{% endblock %}

{% block content %}
<style>
    .contact-page {
        padding: 28px 16px;
    }

    .contact-card {
        max-width: 620px;
        margin: 0 auto;
        padding: 28px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.10);
    }

    .contact-card h1 {
        margin: 0 0 24px;
        color: #0f3b67;
        font-size: 22px;
        font-weight: 700;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        color: #334155;
        font-size: 13px;
        font-weight: 600;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        height: 42px;
        padding: 0 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #ffffff;
        color: #0f172a;
        font-size: 14px;
        box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: #2f91aa;
        box-shadow: 0 0 0 3px rgba(47, 145, 170, 0.15);
    }

    .button-group {
        display: flex;
        gap: 10px;
        margin-top: 24px;
    }

    .btn {
        padding: 11px 22px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
    }

    .btn-primary {
        background: #2f91aa;
        color: #ffffff;
    }

    .btn-primary:hover {
        background: #247b91;
    }

    .btn-secondary {
        background: #e2e8f0;
        color: #334155;
    }

    .btn-secondary:hover {
        background: #cbd5e1;
    }
</style>

<div class="contact-page">
    <div class="contact-card">
        <h1>Add Contact for {{ company.name }}</h1>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" name="address" id="address" required>
            </div>

            <div class="form-group">
                <label for="company_type">Company Type</label>
                <select name="company_type" id="company_type">
                    <option value="suppliers">Suppliers</option>
                    <option value="hauler">Hauler</option>
                    <option value="buyers">Buyers</option>
                </select>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">
                    Add Contact
                </button>

                <a href="{% url 'company_detail' company.id %}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
